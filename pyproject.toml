[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "restockradar"
version = "0.1.0"
description = "Stock & Drop Monitor — polls retailer product feeds and alerts on restocks, price drops, and new products via Discord webhooks."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "httpx>=0.27",
    "apscheduler>=3.10",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
restockradar = "restockradar.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/restockradar"]

# ----------------------------------------------------------------------------
# Ruff — lint + format
# ----------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["restockradar"]

# ----------------------------------------------------------------------------
# mypy — strict typing (Req 19.2)
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
mypy_path = "src"
packages = ["restockradar"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
# pytest + pytest-asyncio
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
filterwarnings = ["error"]
